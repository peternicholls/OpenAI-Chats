[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-archive-api"
version = "0.1.0"
description = "Web API for ChatGPT Archive"
requires-python = ">=3.11"  # API backend; the chatgpt_archive CLI/library supports >=3.10
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "chatgpt-archive",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.0",
    "httpx>=0.27.0",
    "ruff>=0.2.0",
    "black==26.1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "S101",   # assert detected (OK in tests)
    "B008",   # function-call-in-default-argument (FastAPI Depends pattern)
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "models*", "routers*", "services*", "middleware*"]

[tool.ruff.lint.isort]
known-first-party = ["api", "chatgpt_archive"]

[tool.black]
target-version = ["py311"]
line-length = 100
exclude = '''
/(
    \.venv
  | __pycache__
  | \.git
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--tb=short"
