openapi: "3.1.0"
info:
  title: ChatGPT Archive API — Message Rendering Contract
  version: "1.0.0"
  description: |
    Runtime response contract for feature 004-frontend-formatting.
    The conversation endpoint remains the same route, but Message objects gain
    ordered rendering segments for the frontend.

components:
  schemas:
    RenderSegment:
      type: object
      required:
        - kind
      discriminator:
        propertyName: kind
      oneOf:
        - title: MarkdownSegment
          description: A prose or markdown block. text is required and non-empty; attachment_index and fallback_label must be absent.
          type: object
          required: [kind, text]
          properties:
            kind:
              type: string
              enum: [markdown]
            text:
              type: string
              minLength: 1
              description: Markdown source text for the block.
            attachment_index:
              not: {}
            fallback_label:
              not: {}
        - title: AttachmentSegment
          description: An inline attachment reference. attachment_index is required; text and fallback_label must be absent.
          type: object
          required: [kind, attachment_index]
          properties:
            kind:
              type: string
              enum: [attachment]
            attachment_index:
              type: integer
              minimum: 0
              description: Zero-based index into Message.attachments.
            text:
              not: {}
            fallback_label:
              not: {}
        - title: FallbackSegment
          description: A labeled fallback block for unsupported or malformed content. Both text and fallback_label are required and non-empty; attachment_index must be absent.
          type: object
          required: [kind, text, fallback_label]
          properties:
            kind:
              type: string
              enum: [fallback]
            text:
              type: string
              minLength: 1
              description: Readable representation of the unsupported content.
            fallback_label:
              type: string
              minLength: 1
              description: Short explanation shown as a block label, e.g. "Unsupported content".
            attachment_index:
              not: {}
        - title: ThinkingSegment
          description: A collapsible indicator representing one or more consecutive internal AI processing turns (reasoning, web search, or both) within a single response exchange. Actual content is not available in the archive export. Rendered as a collapsed pill by default; expandable to show an availability disclosure.
          type: object
          required: [kind, activity_type]
          properties:
            kind:
              type: string
              enum: [thinking]
            activity_type:
              type: string
              enum: [reasoning, search, both]
              description: >
                "reasoning" — only assistant `thoughts`/`reasoning_recap` nodes were present.
                "search" — only tool-dispatch `code` and `web.run` tool nodes were present.
                "both" — a mix of reasoning and search nodes were present in the exchange.
            text:
              not: {}
            fallback_label:
              not: {}
            attachment_index:
              not: {}

    Attachment:
      type: object
      required: [type, url, filename, found]
      properties:
        type:
          type: string
          enum: [image, audio, file]
        url:
          type: string
        filename:
          type: string
        mime_type:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        size_bytes:
          type: integer
          nullable: true
        found:
          type: boolean

    Message:
      type: object
      required: [id, role, attachments, segments]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string
          nullable: true
          description: Backward-compatible cleaned content fallback.
        create_time:
          type: number
          nullable: true
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/RenderSegment"
          description: Ordered frontend rendering contract for the message body.
