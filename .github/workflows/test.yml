name: Tests

on:
  push:
    branches: [main, "002-web-ui"]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install chatgpt-archive library
        run: |
          pip install -e ".[dev,excel]"

      - name: Install API dependencies
        working-directory: api
        run: |
          pip install -e ".[dev]"

      - name: Run library unit tests
        run: |
          pytest tests/ -v --tb=short --ignore=tests/unit -q

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short

      - name: Run API integration tests
        run: |
          pytest api/tests/ -v --tb=short

      - name: Run all tests with coverage
        run: |
          pytest tests/ api/tests/ --cov=chatgpt_archive --cov=api --cov-report=term-missing --cov-fail-under=60 -q

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run TypeScript type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Run ESLint
        working-directory: web
        run: npm run lint

      - name: Run unit tests
        working-directory: web
        run: npm run test

      - name: Run tests with coverage
        working-directory: web
        run: npm run test:coverage

  python-lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff and black
        run: pip install ruff black==26.1.0

      - name: Run ruff linter
        run: ruff check chatgpt_archive/ api/

      - name: Check black formatting
        run: black --check chatgpt_archive/ api/
