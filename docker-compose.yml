# ChatGPT Archive Web UI
# Run with: docker-compose up -d
# Access at: http://localhost:3000
#
# For configuration options, see docs/DEPLOYMENT.md

services:
  # Backend API (FastAPI + Python)
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount host data directory for database persistence
      # Data in ~/.chatgpt-archive/ persists across container restarts
      - ${HOME}/.chatgpt-archive:/data
    environment:
      # CHATGPT_ARCHIVE_DB: Path to SQLite database inside container
      # Default: /data/chats.db (maps to ~/.chatgpt-archive/chats.db on host)
      - CHATGPT_ARCHIVE_DB=/data/chats.db
      
      # API_HOST: Network interface to bind to
      # 0.0.0.0 = all interfaces (required for Docker), 127.0.0.1 = localhost only
      # WARNING: 0.0.0.0 exposes API to all network interfaces
      - API_HOST=0.0.0.0
      
      # API_PORT: Port for the API server
      - API_PORT=8000
      
      # CORS_ORIGINS: JSON array of allowed origins for CORS
      # Must include the frontend URL. Add production domains as needed.
      - CORS_ORIGINS=["http://localhost:3000"]
      
      # OPENAI_API_KEY: Required for semantic search / embeddings
      # Uncomment and set to enable semantic search:
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js)
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      # NEXT_PUBLIC_API_URL: Backend API URL (internal Docker network)
      # Use the service name 'api' for container-to-container communication
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
